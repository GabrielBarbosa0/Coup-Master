name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -f .nojekyll
          test -f login.html
          test -f lobby.html
          test -f index.html
          test -f ranked-waiting.html
          test -f ranked.html
          if find . -type l -print -quit | grep -q .; then
            echo "Symlinks are not supported by GitHub Pages artifacts."
            find . -type l -print
            exit 1
          fi

      - name: Show artifact summary
        run: |
          echo "Publishing repository root as a static GitHub Pages artifact."
          du -sh .
          find . -maxdepth 2 -type f | sort | head -200

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
