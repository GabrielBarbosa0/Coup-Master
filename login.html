<!doctype html>
<html lang="pt-BR" data-i18n-title="login.title">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <meta name="color-scheme" content="dark">

    <title>Login | Coup Master - Jogue Coup Online com Amigos</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/img/logo/favicon-coup-master.png" type="image/png">
    <link rel="shortcut icon" href="assets/img/logo/favicon-coup-master.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/img/logo/coup-master-192x192.png">

    <link rel="canonical" href="https://gabrielbarbosa0.github.io/Coup-Master/login.html" />

    <meta name="description"
        content="Faça login no Coup Master com Google ou entre como visitante para jogar Coup online com amigos."
        data-i18n-content="login.metaDescription">
    <meta name="keywords"
        content="coup online, login coup master, jogar coup com amigos, coup multiplayer, coup visitante"
        data-i18n-content="login.metaKeywords">
    <meta name="author" content="Gabriel Barbosa">
    <meta name="theme-color" content="#14171e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Coup Master">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gabrielbarbosa0.github.io/Coup-Master/login.html">
    <meta property="og:title" content="Entrar no Coup Master" data-i18n-content="login.ogTitle">
    <meta property="og:description" content="Entre com Google ou como visitante para jogar Coup online."
        data-i18n-content="login.ogDescription">
    <meta property="og:image" content="https://gabrielbarbosa0.github.io/Coup-Master/assets/img/logo/ico-coup-master.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="assets/fonts/Cinzel-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <link rel="preload" href="assets/fonts/tilda-script-bold.woff2" as="font" type="font/woff2" crossorigin>
    <script src="js/i18n/initial-language.js?v=i18n-v3"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <link rel="stylesheet" href="css/lobby.css?v=legal-docs-v1">
    <link rel="stylesheet" href="css/loading.css?v=clean-spinner-v3">
    <link rel="stylesheet" href="css/compat.css?v=samsung-compat-v1">
</head>

<body class="login-page">

    <details class="language-floating">
        <summary class="language-floating-toggle" aria-label="Idioma" title="Idioma"
            data-i18n-aria-label="language.label" data-i18n-title="language.label">
            <img src="assets/img/icons/translate.svg" alt="" aria-hidden="true">
        </summary>
        <div class="language-floating-panel">
            <div class="language-switcher">
                <label for="languageSelectLogin" data-i18n="language.label">Idioma</label>
                <select id="languageSelectLogin" data-language-select>
                    <option value="pt-BR" data-i18n="language.portuguese">Português</option>
                    <option value="en-US" data-i18n="language.english">English</option>
                </select>
            </div>
        </div>
    </details>

    <main class="lobby-box auth-box">
        <h1>Coup Master</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle">Entre para criar ou acessar uma sala.</p>

        <div class="auth-actions">
            <button id="google-login-btn" class="auth-btn google-auth-btn">
                <img src="assets/img/icons/google.svg" alt="G" class="google-icon">
                <span data-i18n="login.google">Entrar com Google</span>
            </button>

            <button id="anonymous-login-btn" class="auth-btn anonymous-auth-btn">
                <span data-i18n="login.guest">Entrar como visitante</span>
            </button>

            <button id="installPwaBtn" class="auth-btn install-auth-btn" hidden>
                <span data-i18n="login.install">Instalar Coup Master</span>
            </button>
        </div>
    </main>

    <div id="errorModal" class="modal-overlay" style="display: none;">
        <div class="modal-content"
            style="max-width: 300px; text-align: center; background: var(--panel); border: 1px solid #ffffff1a;">
            <h2 style="margin-top: 0; color: #ffffff;" data-i18n="common.attention">Atenção</h2>
            <p id="errorModalText" style="margin-bottom: 25px; font-size: 14px; color: #e6eef6cc;" data-i18n="login.defaultError">Erro ao fazer login.</p>
            <button id="closeErrorModalBtn"
                style="background: #1e90ff; color: white; border: 0; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-family: 'Cinzel', serif;" data-i18n="common.ok">OK</button>
        </div>
    </div>

    <footer class="legal-footer" aria-label="Documentos legais" data-i18n-aria-label="common.legalDocuments">
        <a class="legal-footer-link" href="legal/privacy.html">
            <img src="assets/img/icons/parchment.svg" alt="" aria-hidden="true">
            <span data-i18n="common.privacy">Privacidade</span>
        </a>
        <a class="legal-footer-link" href="legal/terms.html">
            <img src="assets/img/icons/gavel.svg" alt="" aria-hidden="true">
            <span data-i18n="common.terms">Termos</span>
        </a>
    </footer>

    <div class="vignette"></div>


    <script src="js/ui/selection-lock.js?v=selection-lock-v1" defer></script>
    <script src="js/i18n/language-service.js?v=i18n-v3" defer></script>
    <script src="js/firebase/firebase.js" defer></script>
    <script src="js/pwa/pwa.js" defer></script>
    <script src="js/login/login-manager.js" defer></script>

</body>

</html>
