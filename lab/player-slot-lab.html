<!DOCTYPE html>
<html lang="pt-BR" data-casual-theme="classic">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Slot Lab - Coup Master</title>
  <link rel="icon" href="../assets/img/logo/favicon-coup-master-circulo.png" type="image/png">
  <link rel="stylesheet" href="player-slot-lab.css">
</head>

<style>
  @font-face {
    font-family: "Harlean";
    src: url("../assets/fonts/Harlean-Exfont908e.otf") format("opentype");
    font-display: swap;
  }

  @font-face {
    font-family: "AGaramond";
    src: url("../assets/fonts/AGaramond-Regular-Exfontab8d.otf") format("opentype");
    font-display: swap;
  }

  @font-face {
    font-family: "AGaramond";
    src: url("../assets/fonts/AGaramond-Semibold-Exfonta037.otf") format("opentype");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --bg: #171d26;
    --panel: #232a33;
    --panel-strong: #111923;
    --panel-soft: #1c2530;
    --text: #e6eef6;
    --muted: #91a0af;
    --accent: #1e90ff;
    --coin: #dce7ef;
    --gold: #f6c204;
    --line: rgba(230, 238, 246, 0.14);
    --seat-border: rgba(133, 154, 177, 0.28);
    --radius: 8px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    color: var(--text);
    font-family: AGaramond, Georgia, serif;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
      var(--bg);
    background-size: 42px 42px;
  }

  button,
  input,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .lab-shell {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 18px;
    width: min(1240px, calc(100% - 28px));
    min-height: 100vh;
    margin: 0 auto;
    padding: 18px 0;
  }

  .control-panel,
  .preview-panel {
    border: 2px solid var(--line);
    border-radius: var(--radius);
    background: rgba(17, 25, 35, 0.96);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
  }

  .control-panel {
    position: sticky;
    top: 18px;
    align-self: start;
    max-height: calc(100dvh - 36px);
    padding: 16px;
    overflow: auto;
  }

  .lab-heading,
  .preview-header,
  .range-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .eyebrow {
    margin: 0 0 5px;
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  h1 {
    margin-bottom: 0;
    font-family: Harlean, AGaramond, serif;
    font-size: 32px;
    font-weight: 400;
  }

  .back-link,
  .icon-action {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 2px solid var(--seat-border);
    border-radius: 7px;
    color: var(--text);
    background: var(--panel);
    text-decoration: none;
  }

  .control-section {
    margin-top: 16px;
    padding-top: 15px;
    border-top: 1px solid var(--line);
  }

  .control-section h2,
  .range-heading h2 {
    margin-bottom: 9px;
    font-size: 12px;
    text-transform: uppercase;
  }

  .range-heading h2 {
    margin: 0;
  }

  .range-heading output {
    color: var(--accent);
    font-weight: 700;
  }

  .segmented-control,
  .option-grid,
  .border-option-grid,
  .action-row {
    display: grid;
    gap: 6px;
  }

  .segmented-control {
    grid-template-columns: repeat(2, 1fr);
  }

  .option-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .border-option-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .border-option-grid button:last-child {
    grid-column: 1 / -1;
  }

  .control-panel button:not(.icon-action),
  .comparison-card {
    min-height: 38px;
    padding: 7px 9px;
    border: 2px solid var(--seat-border);
    border-radius: 7px;
    color: var(--text);
    background: var(--panel);
    font-weight: 700;
  }

  .control-panel button.is-selected,
  .comparison-card.is-selected {
    border-color: var(--accent);
    color: #fff;
    background: #173a59;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .form-grid label {
    display: grid;
    gap: 5px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .form-grid label:last-child {
    grid-column: 1 / -1;
  }

  .form-grid select,
  .form-grid input {
    width: 100%;
    min-width: 0;
    min-height: 38px;
    padding: 7px 9px;
    border: 1px solid var(--seat-border);
    border-radius: 6px;
    color: var(--text);
    background: #0e1720;
    outline: none;
  }

  .form-grid select:focus,
  .form-grid input:focus {
    border-color: var(--accent);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .action-row {
    grid-template-columns: 38px 1fr 38px;
    margin-top: 10px;
  }

  .compact-settings {
    display: grid;
    gap: 10px;
  }

  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .check-row input {
    accent-color: var(--accent);
  }

  .preview-panel {
    display: grid;
    grid-template-rows: auto minmax(430px, 1fr) auto;
    min-width: 0;
    overflow: hidden;
  }

  .preview-header {
    min-height: 78px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-soft);
  }

  .preview-header h2 {
    margin: 0;
    font-size: 20px;
  }

  .preview-metrics {
    display: flex;
    gap: 6px;
  }

  .preview-metrics span {
    padding: 6px 8px;
    border: 1px solid var(--seat-border);
    border-radius: 5px;
    color: var(--muted);
    font-size: 11px;
  }

  .preview-stage {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 0;
    padding: 28px;
    overflow: hidden;
    background: #0b131c;
  }

  .preview-frame {
    display: grid;
    place-items: center;
    width: min(100%, 720px);
    min-height: 370px;
    padding: 26px;
    border: 1px solid rgba(230, 238, 246, 0.08);
    background:
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
      #171d26;
    background-size: 42px 42px;
    transition: width 220ms ease, min-height 220ms ease;
  }

  .preview-frame.is-mobile {
    width: min(100%, 407px);
    min-height: 520px;
  }

  .game-table {
    --card-width: 65px;
    --card-radius: 6px;
    --seat-border: rgba(133, 154, 177, 0.28);
    width: 288px;
  }

  .preview-frame.is-mobile .game-table {
    --card-width: 54px;
    width: 194px;
  }

  .player-area {
    --slot-outline: var(--seat-border);
    position: relative;
    display: grid;
    grid-template-rows: auto auto minmax(78px, 1fr);
    align-content: start;
    width: 100%;
    min-height: 200px;
    padding: 12px 14px 10px;
    overflow: visible;
    border: 2px solid var(--seat-border);
    border-radius: 8px;
    background: rgba(17, 25, 35, 0.94);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
    transition: opacity 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }

  .preview-frame.is-mobile .player-area {
    min-height: 154px;
    padding: 7px 7px 4px;
  }

  .player-area.local-player {
    --slot-outline: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(30, 144, 255, 0.24), 0 10px 22px rgba(0, 0, 0, 0.3);
  }

  .player-area.is-active-player {
    --slot-outline: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 16px rgba(246, 194, 4, 0.22), 0 10px 22px rgba(0, 0, 0, 0.3);
  }

  .player-area.is-disconnected {
    opacity: 0.52;
    filter: saturate(0.45);
  }

  .player-area.is-eliminated {
    opacity: 0.48;
    filter: grayscale(0.85);
  }

  .player-area[data-border="cut"] {
    isolation: isolate;
    border: 0;
    border-radius: 0;
    clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
    background: transparent;
  }

  .player-area[data-border="cut"]::before,
  .player-area[data-border="cut"]::after {
    content: "";
    position: absolute;
    pointer-events: none;
    clip-path: inherit;
  }

  .player-area[data-border="cut"]::before {
    z-index: -2;
    inset: 0;
    background: var(--slot-outline);
  }

  .player-area[data-border="cut"]::after {
    z-index: -1;
    inset: 2px;
    background: rgba(17, 25, 35, 0.98);
  }

  .player-area[data-border="corners"] {
    border-color: transparent;
    border-radius: 2px;
    background:
      linear-gradient(var(--slot-outline), var(--slot-outline)) left top / 30px 2px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) left top / 2px 30px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) right top / 30px 2px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) right top / 2px 30px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) left bottom / 30px 2px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) left bottom / 2px 30px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) right bottom / 30px 2px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) right bottom / 2px 30px no-repeat,
      rgba(17, 25, 35, 0.94);
  }

  .player-area[data-border="double"] {
    border-color: var(--slot-outline);
    border-radius: 5px;
    box-shadow:
      inset 0 0 0 3px rgba(17, 25, 35, 1),
      inset 0 0 0 4px color-mix(in srgb, var(--slot-outline) 54%, transparent),
      0 10px 22px rgba(0, 0, 0, 0.3);
  }

  .slot-frame {
    position: absolute;
    z-index: 3;
    inset: -9px;
    display: none;
    pointer-events: none;
  }

  .frame-corner,
  .frame-ornament {
    position: absolute;
    display: block;
  }

  .player-area[data-border="document"],
  .player-area[data-border="archive"],
  .player-area[data-border="ornate"] {
    border-radius: 1px;
  }

  .player-area[data-border="document"] {
    border: 0;
    border-radius: 0;
  }

  .player-area[data-border="document"] .slot-frame,
  .player-area[data-border="archive"] .slot-frame,
  .player-area[data-border="ornate"] .slot-frame {
    display: block;
  }

  .player-area[data-border="document"] .slot-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(var(--slot-outline), var(--slot-outline)) 14px 0 / calc(100% - 28px) 1px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) 14px calc(100% - 1px) / calc(100% - 28px) 1px no-repeat;
  }

  .player-area[data-border="document"] .slot-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(var(--slot-outline), var(--slot-outline)) 0 14px / 1px calc(100% - 28px) no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) calc(100% - 1px) 14px / 1px calc(100% - 28px) no-repeat;
  }

  .player-area[data-border="document"] .frame-corner {
    width: 15px;
    height: 15px;
    background:
      linear-gradient(var(--slot-outline), var(--slot-outline)) 14px 0 / 1px 10px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) 9px 9px / 6px 1px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) 9px 9px / 1px 6px no-repeat,
      linear-gradient(var(--slot-outline), var(--slot-outline)) 0 14px / 10px 1px no-repeat;
  }

  .player-area[data-border="document"] .frame-corner::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 5px;
    height: 5px;
    border: 1px solid color-mix(in srgb, var(--slot-outline) 76%, #e6eef6);
    background: #111923;
  }

  .player-area[data-border="document"] .top-left {
    top: 0;
    left: 0;
  }

  .player-area[data-border="document"] .top-right {
    top: 0;
    right: 0;
    transform: scaleX(-1);
  }

  .player-area[data-border="document"] .bottom-left {
    bottom: 0;
    left: 0;
    transform: scaleY(-1);
  }

  .player-area[data-border="document"] .bottom-right {
    right: 0;
    bottom: 0;
    transform: scale(-1);
  }

  .player-area[data-border="archive"] {
    border: 1px solid var(--slot-outline);
    box-shadow:
      inset 0 0 0 4px #111923,
      inset 0 0 0 5px color-mix(in srgb, var(--slot-outline) 38%, transparent),
      0 10px 22px rgba(0, 0, 0, 0.3);
  }

  .player-area[data-border="archive"] .slot-frame::before,
  .player-area[data-border="archive"] .slot-frame::after {
    content: "";
    position: absolute;
    border: solid color-mix(in srgb, var(--slot-outline) 78%, #e6eef6);
  }

  .player-area[data-border="archive"] .slot-frame::before {
    inset: 4px 18px;
    border-width: 1px 0;
  }

  .player-area[data-border="archive"] .slot-frame::after {
    inset: 18px 4px;
    border-width: 0 1px;
  }

  .player-area[data-border="archive"] .frame-corner {
    width: 9px;
    height: 9px;
    border: 1px solid var(--slot-outline);
    background: #111923;
    transform: rotate(45deg);
  }

  .player-area[data-border="archive"] .top-left {
    top: 2px;
    left: 8px;
  }

  .player-area[data-border="archive"] .top-right {
    top: 2px;
    right: 8px;
  }

  .player-area[data-border="archive"] .bottom-left {
    bottom: 2px;
    left: 8px;
  }

  .player-area[data-border="archive"] .bottom-right {
    right: 8px;
    bottom: 2px;
  }

  .player-area[data-border="ornate"] {
    border: 1px solid color-mix(in srgb, var(--slot-outline) 82%, #e6eef6);
    box-shadow:
      inset 0 0 0 3px #111923,
      inset 0 0 0 4px color-mix(in srgb, var(--slot-outline) 32%, transparent),
      0 10px 22px rgba(0, 0, 0, 0.3);
  }

  .player-area[data-border="ornate"] .slot-frame::before,
  .player-area[data-border="ornate"] .slot-frame::after {
    content: "";
    position: absolute;
    left: 24px;
    right: 24px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--slot-outline) 22%, var(--slot-outline) 78%, transparent);
  }

  .player-area[data-border="ornate"] .slot-frame::before {
    top: 5px;
  }

  .player-area[data-border="ornate"] .slot-frame::after {
    bottom: 5px;
  }

  .player-area[data-border="ornate"] .frame-corner {
    width: 18px;
    height: 18px;
    border: solid var(--slot-outline);
  }

  .player-area[data-border="ornate"] .top-left {
    top: 4px;
    left: 4px;
    border-width: 1px 0 0 1px;
  }

  .player-area[data-border="ornate"] .top-right {
    top: 4px;
    right: 4px;
    border-width: 1px 1px 0 0;
  }

  .player-area[data-border="ornate"] .bottom-left {
    bottom: 4px;
    left: 4px;
    border-width: 0 0 1px 1px;
  }

  .player-area[data-border="ornate"] .bottom-right {
    right: 4px;
    bottom: 4px;
    border-width: 0 1px 1px 0;
  }

  .player-area[data-border="ornate"] .frame-ornament {
    left: 50%;
    width: 9px;
    height: 9px;
    border: 1px solid var(--slot-outline);
    background: #111923;
    transform: translateX(-50%) rotate(45deg);
  }

  .player-area[data-border="ornate"] .frame-ornament.top {
    top: 1px;
  }

  .player-area[data-border="ornate"] .frame-ornament.bottom {
    bottom: 1px;
  }

  .player-header {
    position: relative;
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) 28px;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .player-avatar,
  .religion-badge {
    width: 28px;
    height: 28px;
    border: 1px solid var(--accent);
    border-radius: 50%;
    object-fit: cover;
  }

  .player-avatar {
    padding: 3px;
    background: rgba(17, 29, 42, 0.96);
    object-fit: contain;
  }

  .player-copy {
    min-width: 0;
    text-align: center;
  }

  .player-title {
    margin: 0;
    overflow: hidden;
    color: var(--accent);
    font-size: 14px;
    line-height: 1.05;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-status {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .player-status[hidden] {
    display: none;
  }

  .points,
  .coin-counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 7px 0;
  }

  .points button,
  .coin-counter button {
    display: inline-grid;
    place-items: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    color: #0b1117;
    background: var(--coin);
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
  }

  .score,
  .coin-readout strong,
  .header-counter strong {
    min-width: 18px;
    color: var(--text);
    font-size: 17px;
    line-height: 1;
    text-align: center;
  }

  .coin-counter,
  .header-counter {
    display: none;
  }

  .coin-readout {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 58px;
    padding: 3px 8px 3px 5px;
    border: 1px solid rgba(220, 231, 239, 0.38);
    border-radius: 16px;
    background: #182531;
    box-shadow: 0 0 12px rgba(220, 231, 239, 0.08);
  }

  .coin-readout img,
  .header-counter img {
    width: 23px;
    height: 23px;
    object-fit: contain;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.28));
  }

  .player-area[data-counter="coin"] .classic-counter {
    display: none;
  }

  .player-area[data-counter="coin"] .coin-counter {
    display: flex;
  }

  .player-area[data-counter="header"] {
    grid-template-rows: auto minmax(100px, 1fr);
  }

  .player-area[data-counter="header"] .classic-counter {
    display: none;
  }

  .player-area[data-counter="header"] .player-header {
    grid-template-columns: 28px minmax(0, 1fr) auto;
  }

  .player-area[data-counter="header"] .religion-badge {
    display: none;
  }

  .player-area[data-counter="header"] .header-counter {
    display: flex;
    align-items: center;
    gap: 3px;
    min-height: 30px;
    padding: 2px 7px 2px 3px;
    border: 1px solid rgba(220, 231, 239, 0.38);
    border-radius: 16px;
    background: #182531;
  }

  .player-stack {
    display: flex;
    align-items: end;
    justify-content: center;
    min-height: 78px;
    width: 100%;
    padding: 2px 0 10px;
    perspective: 820px;
  }

  .slot {
    position: relative;
    flex: 0 0 var(--card-width);
    width: var(--card-width);
    aspect-ratio: 2 / 3;
  }

  .slot+.slot {
    margin-left: -12px;
  }

  .card {
    width: 100%;
    height: 100%;
    border: 1px solid #3b5998;
    border-radius: var(--card-radius);
    background-color: #fff;
    background-position: center;
    background-size: cover;
    box-shadow: 0 7px 12px rgba(0, 0, 0, 0.28);
    cursor: grab;
    transition: transform 160ms ease, box-shadow 160ms ease;
  }

  .card:hover {
    position: relative;
    z-index: 5;
    transform: translateY(-8px) rotate(2deg) scale(1.08);
    box-shadow: 0 16px 25px rgba(0, 0, 0, 0.48);
  }

  .comparison-strip {
    padding: 16px 18px 18px;
    border-top: 1px solid var(--line);
    background: var(--panel-soft);
  }

  .comparison-strip h2 {
    margin-bottom: 10px;
    font-size: 13px;
    text-transform: uppercase;
  }

  .comparison-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .comparison-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
  }

  .mini-counter {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .mini-counter i {
    display: grid;
    place-items: center;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    color: #101820;
    background: var(--coin);
    font-style: normal;
  }

  .coin-mini img {
    width: 22px;
    height: 22px;
  }

  .coin-animation-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  .flying-coin {
    position: absolute;
    width: 30px;
    height: 30px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.55));
    animation: flyCoin 720ms cubic-bezier(0.18, 0.82, 0.2, 1) forwards;
  }

  .player-area.is-coin-pulsing {
    animation: slotCoinPulse 440ms ease;
  }

  @keyframes flyCoin {
    0% {
      opacity: 0;
      transform: translate3d(var(--start-x), var(--start-y), 0) scale(0.6) rotate(-35deg);
    }

    20% {
      opacity: 1;
    }

    55% {
      transform: translate3d(var(--mid-x), var(--mid-y), 0) scale(1.05) rotate(18deg);
    }

    100% {
      opacity: 0;
      transform: translate3d(var(--end-x), var(--end-y), 0) scale(0.72) rotate(48deg);
    }
  }

  @keyframes slotCoinPulse {
    45% {
      box-shadow: 0 0 24px rgba(220, 231, 239, 0.36);
    }
  }

  @media (max-width: 820px) {
    .lab-shell {
      grid-template-columns: 1fr;
    }

    .control-panel {
      position: static;
      max-height: none;
    }

    .preview-panel {
      grid-template-rows: auto minmax(500px, 1fr) auto;
    }
  }

  @media (max-width: 540px) {
    .lab-shell {
      width: calc(100% - 16px);
      padding: 8px 0;
    }

    .preview-stage {
      padding: 8px;
    }

    .preview-frame {
      min-height: 480px;
      padding: 12px;
    }

    .preview-header,
    .comparison-strip {
      padding-inline: 12px;
    }

    .preview-header {
      align-items: start;
    }

    .preview-metrics {
      flex-direction: column;
    }

    .comparison-card {
      justify-content: center;
    }

    .comparison-card>span:first-child {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 1ms !important;
      transition-duration: 1ms !important;
    }
  }
</style>

<body>
  <main class="lab-shell">
    <aside class="control-panel" aria-label="Controles do laboratório">
      <header class="lab-heading">
        <div>
          <p class="eyebrow">Casual UI Lab</p>
          <h1>Slot de jogador</h1>
        </div>
        <a class="back-link" href="../index.html" aria-label="Voltar para a mesa">&#8592;</a>
      </header>

      <section class="control-section">
        <h2>Visualização</h2>
        <div class="segmented-control" role="group" aria-label="Largura da prévia">
          <button type="button" class="is-selected" data-viewport="desktop">Desktop</button>
          <button type="button" data-viewport="mobile">Mobile</button>
        </div>
      </section>

      <section class="control-section">
        <h2>Contador</h2>
        <div class="option-grid" role="group" aria-label="Modelo do contador">
          <button type="button" class="is-selected" data-counter-style="classic">Clássico</button>
          <button type="button" data-counter-style="coin">Moeda</button>
          <button type="button" data-counter-style="header">Cabeçalho</button>
        </div>
      </section>

      <section class="control-section">
        <h2>Borda do slot</h2>
        <div class="border-option-grid" role="group" aria-label="Formato da borda do slot">
          <button type="button" class="is-selected" data-border-style="standard">Atual</button>
          <button type="button" data-border-style="cut">Recortada</button>
          <button type="button" data-border-style="corners">Cantos</button>
          <button type="button" data-border-style="double">Dupla</button>
          <button type="button" data-border-style="document">Documento</button>
          <button type="button" data-border-style="archive">Arquivo</button>
          <button type="button" data-border-style="ornate">Ornamental</button>
        </div>
      </section>

      <section class="control-section form-grid">
        <label>
          Estado
          <select id="stateSelect">
            <option value="local">Jogador local</option>
            <option value="active">Turno ativo</option>
            <option value="default">Outro jogador</option>
            <option value="disconnected">Desconectado</option>
            <option value="eliminated">Eliminado</option>
          </select>
        </label>

        <label>
          Cartas
          <select id="cardCountSelect">
            <option value="0">Nenhuma</option>
            <option value="1">Uma carta</option>
            <option value="2" selected>Duas cartas</option>
          </select>
        </label>

        <label>
          Exibição
          <select id="cardFaceSelect">
            <option value="mixed">Uma revelada</option>
            <option value="hidden" selected>Ocultas</option>
            <option value="revealed">Reveladas</option>
          </select>
        </label>

        <label>
          Nome
          <input id="playerNameInput" type="text" maxlength="42" value="Gabriel Barbosa">
        </label>
      </section>

      <section class="control-section">
        <div class="range-heading">
          <h2>Moedas</h2>
          <output id="coinOutput" for="coinRange">2</output>
        </div>
        <input id="coinRange" type="range" min="0" max="99" value="2">
        <div class="action-row">
          <button type="button" class="icon-action" id="removeCoinBtn" title="Remover moeda"
            aria-label="Remover moeda">&#8722;</button>
          <button type="button" id="gainCoinBtn">Testar ganho</button>
          <button type="button" class="icon-action" id="addCoinBtn" title="Adicionar moeda"
            aria-label="Adicionar moeda">+</button>
        </div>
      </section>

      <section class="control-section compact-settings">
        <label class="check-row"><input id="religionToggle" type="checkbox" checked> Exibir religião</label>
        <label class="check-row"><input id="statusToggle" type="checkbox" checked> Exibir texto Online</label>
        <label class="check-row"><input id="longNameToggle" type="checkbox"> Testar nome longo</label>
      </section>
    </aside>

    <section class="preview-panel">
      <header class="preview-header">
        <div>
          <p class="eyebrow">Prévia real</p>
          <h2 id="previewTitle">Contador clássico</h2>
        </div>
        <div class="preview-metrics" aria-label="Dimensões da prévia">
          <span id="viewportMetric">Desktop</span>
          <span id="sizeMetric">288 x 200</span>
        </div>
      </header>

      <div class="preview-stage" id="previewStage">
        <div class="coin-animation-layer" id="coinAnimationLayer" aria-hidden="true"></div>

        <div class="preview-frame" id="previewFrame">
          <div class="game-table lab-game-table">
            <article class="player-area local-player" id="playerSlot" data-border="standard"
              aria-label="Slot de Gabriel Barbosa">
              <div class="slot-frame" aria-hidden="true">
                <i class="frame-corner top-left"></i>
                <i class="frame-corner top-right"></i>
                <i class="frame-corner bottom-left"></i>
                <i class="frame-corner bottom-right"></i>
                <b class="frame-ornament top"></b>
                <b class="frame-ornament bottom"></b>
              </div>
              <div class="player-header">
                <img class="player-avatar" src="../assets/img/icons/ghost.svg" alt="">
                <div class="player-copy">
                  <h3 class="player-title" id="playerTitle">Gabriel Barbosa</h3>
                  <span class="player-status" id="playerStatus">Online</span>
                </div>
                <img class="religion-badge" id="religionBadge" src="../assets/img/cards/religion/catolico-quadrado.png"
                  alt="Religião">

                <div class="header-counter" id="headerCounter" aria-label="Controle de moedas">
                  <img src="../assets/img/coins/moeda-prata.png" alt="">
                  <strong data-score>2</strong>
                </div>
              </div>

              <div class="points classic-counter" id="classicCounter" aria-label="Controle de moedas">
                <button type="button" data-adjust="-1" aria-label="Remover moeda">&#8722;</button>
                <span class="score" data-score>2</span>
                <button type="button" data-adjust="1" aria-label="Adicionar moeda">+</button>
              </div>

              <div class="coin-counter" id="coinCounter" aria-label="Controle de moedas">
                <button type="button" data-adjust="-1" aria-label="Remover moeda">&#8722;</button>
                <div class="coin-readout">
                  <img src="../assets/img/coins/moeda-prata.png" alt="Moedas">
                  <strong data-score>2</strong>
                </div>
                <button type="button" data-adjust="1" aria-label="Adicionar moeda">+</button>
              </div>

              <div class="player-stack hand" id="playerHand" data-hand></div>
            </article>
          </div>
        </div>
      </div>

      <section class="comparison-strip" aria-labelledby="comparisonTitle">
        <h2 id="comparisonTitle">Comparação rápida</h2>
        <div class="comparison-grid">
          <button type="button" class="comparison-card is-selected" data-select-style="classic">
            <span>Clássico</span>
            <span class="mini-counter"><i>&#8722;</i><b>2</b><i>+</i></span>
          </button>
          <button type="button" class="comparison-card" data-select-style="coin">
            <span>Moeda</span>
            <span class="mini-counter coin-mini"><i>&#8722;</i><img src="../assets/img/coins/moeda-prata.png"
                alt=""><b>2</b><i>+</i></span>
          </button>
          <button type="button" class="comparison-card" data-select-style="header">
            <span>Cabeçalho</span>
            <span class="mini-counter coin-mini"><img src="../assets/img/coins/moeda-prata.png" alt=""><b>2</b></span>
          </button>
        </div>
      </section>
    </section>
  </main>

  <script src="player-slot-lab.js"></script>
</body>

<script>
  (function setupPlayerSlotLab() {
    const CARD_IMAGES = {
      hidden: '../assets/img/cards/base/back.png',
      first: '../assets/img/cards/base/duque.png',
      second: '../assets/img/cards/base/capitao.png'
    };

    const STYLE_TITLES = {
      classic: 'Contador clássico',
      coin: 'Moeda em destaque',
      header: 'Contador no cabeçalho'
    };

    const STATUS_LABELS = {
      local: 'Online',
      active: 'Sua vez',
      default: 'Online',
      disconnected: 'Desconectado',
      eliminated: 'Eliminado'
    };

    const state = {
      viewport: 'desktop',
      counterStyle: 'classic',
      borderStyle: 'standard',
      playerState: 'local',
      cardCount: 2,
      cardFace: 'hidden',
      coins: 2,
      playerName: 'Gabriel Barbosa',
      showReligion: true,
      showStatus: true,
      longName: false
    };

    const elements = {
      previewFrame: document.getElementById('previewFrame'),
      previewStage: document.getElementById('previewStage'),
      previewTitle: document.getElementById('previewTitle'),
      viewportMetric: document.getElementById('viewportMetric'),
      sizeMetric: document.getElementById('sizeMetric'),
      playerSlot: document.getElementById('playerSlot'),
      playerTitle: document.getElementById('playerTitle'),
      playerStatus: document.getElementById('playerStatus'),
      playerHand: document.getElementById('playerHand'),
      religionBadge: document.getElementById('religionBadge'),
      coinOutput: document.getElementById('coinOutput'),
      coinRange: document.getElementById('coinRange'),
      stateSelect: document.getElementById('stateSelect'),
      cardCountSelect: document.getElementById('cardCountSelect'),
      cardFaceSelect: document.getElementById('cardFaceSelect'),
      playerNameInput: document.getElementById('playerNameInput'),
      religionToggle: document.getElementById('religionToggle'),
      statusToggle: document.getElementById('statusToggle'),
      longNameToggle: document.getElementById('longNameToggle'),
      coinAnimationLayer: document.getElementById('coinAnimationLayer')
    };

    function clampCoins(value) {
      return Math.max(0, Math.min(99, Number(value) || 0));
    }

    function getVisibleName() {
      return state.longName
        ? 'Arquiduque Gabriel Barbosa da Corte Setentrional'
        : state.playerName.trim() || 'Jogador';
    }

    function truncatePlayerName(name) {
      return name.length > 15 ? `${name.slice(0, 15)}...` : name;
    }

    function renderCards() {
      elements.playerHand.replaceChildren();

      for (let index = 0; index < state.cardCount; index += 1) {
        const slot = document.createElement('div');
        slot.className = 'slot';

        const card = document.createElement('div');
        card.className = 'card';
        const isHidden = state.cardFace === 'hidden' || (state.cardFace === 'mixed' && index === 1);
        card.style.backgroundImage = `url("${isHidden ? CARD_IMAGES.hidden : index === 0 ? CARD_IMAGES.first : CARD_IMAGES.second}")`;
        card.setAttribute('aria-label', isHidden ? 'Carta oculta' : index === 0 ? 'Duque' : 'Capitão');

        slot.appendChild(card);
        elements.playerHand.appendChild(slot);
      }
    }

    function render() {
      const visibleName = getVisibleName();
      const displayName = truncatePlayerName(visibleName);
      const isMobile = state.viewport === 'mobile';

      elements.previewFrame.classList.toggle('is-mobile', isMobile);
      elements.playerSlot.dataset.counter = state.counterStyle;
      elements.playerSlot.dataset.border = state.borderStyle;
      elements.playerSlot.classList.toggle('local-player', state.playerState === 'local');
      elements.playerSlot.classList.toggle('is-active-player', state.playerState === 'active');
      elements.playerSlot.classList.toggle('is-disconnected', state.playerState === 'disconnected');
      elements.playerSlot.classList.toggle('is-eliminated', state.playerState === 'eliminated');
      elements.playerSlot.setAttribute('aria-label', `Slot de ${visibleName}`);

      elements.playerTitle.textContent = displayName;
      elements.playerTitle.title = visibleName;
      elements.playerStatus.textContent = STATUS_LABELS[state.playerState];
      elements.playerStatus.hidden = !state.showStatus;
      elements.religionBadge.hidden = !state.showReligion || state.counterStyle === 'header';
      elements.previewTitle.textContent = STYLE_TITLES[state.counterStyle];
      elements.viewportMetric.textContent = isMobile ? 'Mobile 407px' : 'Desktop';
      elements.sizeMetric.textContent = isMobile ? '194 x 154' : '288 x 200';
      elements.coinOutput.textContent = state.coins;
      elements.coinRange.value = state.coins;
      document.querySelectorAll('[data-score]').forEach((score) => { score.textContent = state.coins; });

      document.querySelectorAll('[data-viewport]').forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.viewport === state.viewport);
      });
      document.querySelectorAll('[data-counter-style]').forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.counterStyle === state.counterStyle);
      });
      document.querySelectorAll('[data-border-style]').forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.borderStyle === state.borderStyle);
      });
      document.querySelectorAll('[data-select-style]').forEach((button) => {
        button.classList.toggle('is-selected', button.dataset.selectStyle === state.counterStyle);
      });

      renderCards();
    }

    function adjustCoins(amount, animate = false) {
      const nextCoins = clampCoins(state.coins + amount);
      if (nextCoins === state.coins) return;
      state.coins = nextCoins;
      render();
      if (animate && amount > 0) animateCoinGain();
    }

    function animateCoinGain() {
      const stageRect = elements.previewStage.getBoundingClientRect();
      const slotRect = elements.playerSlot.getBoundingClientRect();
      const coin = document.createElement('img');
      const endX = slotRect.left - stageRect.left + (slotRect.width / 2) - 15;
      const endY = slotRect.top - stageRect.top + 42;
      const startX = Math.max(24, stageRect.width * 0.16);
      const startY = stageRect.height - 58;

      coin.className = 'flying-coin';
      coin.src = '../assets/img/coins/moeda-prata.png';
      coin.alt = '';
      coin.style.setProperty('--start-x', `${startX}px`);
      coin.style.setProperty('--start-y', `${startY}px`);
      coin.style.setProperty('--mid-x', `${(startX + endX) / 2}px`);
      coin.style.setProperty('--mid-y', `${Math.min(startY, endY) - 90}px`);
      coin.style.setProperty('--end-x', `${endX}px`);
      coin.style.setProperty('--end-y', `${endY}px`);
      elements.coinAnimationLayer.appendChild(coin);

      elements.playerSlot.classList.remove('is-coin-pulsing');
      window.setTimeout(() => elements.playerSlot.classList.add('is-coin-pulsing'), 470);
      window.setTimeout(() => {
        coin.remove();
        elements.playerSlot.classList.remove('is-coin-pulsing');
      }, 760);
    }

    document.addEventListener('click', (event) => {
      const viewportButton = event.target.closest('[data-viewport]');
      const counterButton = event.target.closest('[data-counter-style], [data-select-style]');
      const borderButton = event.target.closest('[data-border-style]');
      const adjustButton = event.target.closest('[data-adjust]');

      if (viewportButton) state.viewport = viewportButton.dataset.viewport;
      if (counterButton) state.counterStyle = counterButton.dataset.counterStyle || counterButton.dataset.selectStyle;
      if (borderButton) state.borderStyle = borderButton.dataset.borderStyle;
      if (adjustButton) adjustCoins(Number(adjustButton.dataset.adjust));
      if (viewportButton || counterButton || borderButton) render();
    });

    elements.stateSelect.addEventListener('change', () => {
      state.playerState = elements.stateSelect.value;
      render();
    });
    elements.cardCountSelect.addEventListener('change', () => {
      state.cardCount = Number(elements.cardCountSelect.value);
      render();
    });
    elements.cardFaceSelect.addEventListener('change', () => {
      state.cardFace = elements.cardFaceSelect.value;
      render();
    });
    elements.playerNameInput.addEventListener('input', () => {
      state.playerName = elements.playerNameInput.value;
      render();
    });
    elements.coinRange.addEventListener('input', () => {
      state.coins = clampCoins(elements.coinRange.value);
      render();
    });
    elements.religionToggle.addEventListener('change', () => {
      state.showReligion = elements.religionToggle.checked;
      render();
    });
    elements.statusToggle.addEventListener('change', () => {
      state.showStatus = elements.statusToggle.checked;
      render();
    });
    elements.longNameToggle.addEventListener('change', () => {
      state.longName = elements.longNameToggle.checked;
      render();
    });
    document.getElementById('removeCoinBtn').addEventListener('click', () => adjustCoins(-1));
    document.getElementById('addCoinBtn').addEventListener('click', () => adjustCoins(1));
    document.getElementById('gainCoinBtn').addEventListener('click', () => adjustCoins(1, true));

    render();
  })();

</script>

</html>
