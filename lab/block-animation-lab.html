<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Animation Lab - Coup Master</title>
  <style>
    :root {
      --bg: #14171e;
      --panel: #1b222c;
      --line: rgba(230, 238, 246, 0.16);
      --text: #e6eef6;
      --muted: rgba(230, 238, 246, 0.64);
      --accent: #1e90ff;
      --gold: #ffcc00;
      --block-blue: #28a7ff;
      --block-cyan: #7ee8ff;
      --danger: #ff4048;
      --block-duration: 1320ms;
      --block-shake: 7px;
      --block-ring: 3.4;
      --block-shield-scale: 1.18;
      --block-flash: 0.48;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(30, 144, 255, 0.12), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(126, 232, 255, 0.08), transparent 24%),
        linear-gradient(135deg, #10141b 0%, #171c24 52%, #0e1117 100%);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .lab-shell {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    .controls,
    .stage-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(27, 34, 44, 0.88);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
    }

    .controls {
      position: sticky;
      top: 18px;
      align-self: start;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 16px;
    }

    .controls h1,
    .stage-header h2 {
      margin: 0;
      font-size: 1.42rem;
      line-height: 1.1;
    }

    .controls p,
    .stage-header p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .control-group {
      display: grid;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .control-row {
      display: grid;
      gap: 7px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--text);
      font-size: 0.92rem;
    }

    .control-value {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
      color: var(--text);
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .button-grid button,
    .primary-button {
      min-height: 42px;
      border: 1px solid rgba(30, 144, 255, 0.44);
      border-radius: 7px;
      background: rgba(30, 144, 255, 0.12);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .button-grid button:hover,
    .primary-button:hover {
      border-color: var(--accent);
      background: rgba(30, 144, 255, 0.22);
    }

    .primary-button {
      width: 100%;
      background: var(--accent);
      color: #fff;
    }

    .config-output {
      width: 100%;
      min-height: 154px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.22);
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      resize: vertical;
    }

    .stage-wrap {
      position: relative;
      min-height: calc(100vh - 36px);
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(30, 144, 255, 0.08), transparent 38%),
        rgba(13, 18, 25, 0.95);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .stage-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(16, 23, 32, 0.74);
    }

    .metrics {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .metric {
      min-width: 106px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.16);
      font-size: 0.82rem;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      color: var(--text);
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      min-height: calc(100vh - 144px);
      padding: 22px;
      overflow: hidden;
    }

    .arena {
      position: relative;
      display: grid;
      place-items: center;
      min-height: calc(100vh - 188px);
      max-width: 560px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid rgba(30, 144, 255, 0.28);
      border-radius: 8px;
      background:
        radial-gradient(circle at center, rgba(30, 144, 255, 0.16), transparent 42%),
        rgba(17, 25, 35, 0.86);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .arena.is-blocking {
      animation: arenaShake var(--block-duration) ease-out;
    }

    .block-panel {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 438px;
      width: min(100%, 420px);
      overflow: hidden;
    }

    .shield-core {
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 154px;
      height: 154px;
      border: 2px solid rgba(126, 232, 255, 0.64);
      border-radius: 999px;
      background:
        radial-gradient(circle at center, rgba(126, 232, 255, 0.18), transparent 64%),
        rgba(6, 16, 28, 0.78);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 18px 34px rgba(0, 0, 0, 0.34),
        0 0 28px rgba(30, 144, 255, 0.18);
      opacity: 0.92;
      transform: scale(1);
    }

    .shield-core img {
      width: 86px;
      height: 86px;
      filter:
        brightness(0) invert(1)
        drop-shadow(0 0 12px rgba(126, 232, 255, 0.42));
    }

    .arena.is-blocking .shield-core {
      animation: shieldImpact var(--block-duration) cubic-bezier(0.16, 0.96, 0.22, 1);
    }

    .guard-ring,
    .guard-ring::before,
    .guard-ring::after {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 168px;
      height: 168px;
      border: 2px solid rgba(126, 232, 255, 0.72);
      border-radius: 999px;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.34);
      pointer-events: none;
    }

    .guard-ring {
      content: "";
      z-index: 4;
    }

    .guard-ring::before,
    .guard-ring::after {
      content: "";
    }

    .guard-ring::before {
      border-color: rgba(30, 144, 255, 0.62);
    }

    .guard-ring::after {
      border-color: rgba(255, 204, 0, 0.46);
    }

    .arena.is-blocking .guard-ring {
      animation: guardRing var(--block-duration) ease-out;
    }

    .arena.is-blocking .guard-ring::before {
      animation: guardRing var(--block-duration) ease-out 90ms;
    }

    .arena.is-blocking .guard-ring::after {
      animation: guardRing var(--block-duration) ease-out 170ms;
    }

    .impact-line {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: min(66vw, 520px);
      height: 4px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 64, 72, 0.92), rgba(126, 232, 255, 0.98), transparent);
      box-shadow: 0 0 26px rgba(126, 232, 255, 0.36);
      transform: translate(-50%, -50%) scaleX(0);
      transform-origin: center;
      pointer-events: none;
    }

    .arena.is-blocking .impact-line {
      animation: impactLine var(--block-duration) ease-out;
    }

    .block-stamp {
      position: absolute;
      left: 50%;
      top: 72%;
      z-index: 6;
      min-width: 232px;
      padding: 11px 18px;
      border: 3px solid rgba(126, 232, 255, 0.96);
      border-radius: 8px;
      color: #fff;
      background: rgba(10, 36, 58, 0.94);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.14) inset,
        0 18px 34px rgba(0, 0, 0, 0.38),
        0 0 34px rgba(30, 144, 255, 0.24);
      font-size: clamp(1.36rem, 5vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.76);
      pointer-events: none;
    }

    .arena.is-blocking .block-stamp {
      animation: blockStamp var(--block-duration) cubic-bezier(0.16, 0.96, 0.22, 1);
    }

    .block-copy {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: min(92%, 520px);
      color: rgba(230, 238, 246, 0.82);
      font-size: 0.86rem;
      line-height: 1.45;
      text-align: center;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .block-flash {
      position: absolute;
      inset: 0;
      z-index: 12;
      opacity: 0;
      background:
        radial-gradient(circle at center, rgba(126, 232, 255, var(--block-flash)), transparent 24%),
        radial-gradient(circle at center, rgba(30, 144, 255, 0.28), transparent 54%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .arena.is-blocking .block-flash {
      animation: blockFlash var(--block-duration) ease-out;
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 7;
      width: 7px;
      height: 18px;
      border-radius: 999px;
      background: var(--block-cyan);
      box-shadow: 0 0 14px rgba(126, 232, 255, 0.82);
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--spark-rotate)) scaleY(0.24);
      transform-origin: center;
    }

    .arena.is-blocking .spark {
      animation: sparkDeflect var(--block-duration) ease-out;
      animation-delay: var(--spark-delay);
    }

    @keyframes arenaShake {
      0%, 22%, 100% {
        transform: translate3d(0, 0, 0);
      }

      29% {
        transform: translate3d(calc(var(--block-shake) * -1), 0, 0);
      }

      36% {
        transform: translate3d(var(--block-shake), calc(var(--block-shake) * 0.28), 0);
      }

      44% {
        transform: translate3d(calc(var(--block-shake) * -0.42), calc(var(--block-shake) * -0.24), 0);
      }
    }

    @keyframes shieldImpact {
      0%, 18% {
        opacity: 0;
        transform: translateY(16px) scale(0.62) rotate(-8deg);
      }

      30% {
        opacity: 1;
        transform: translateY(0) scale(var(--block-shield-scale)) rotate(0deg);
      }

      45% {
        transform: translateY(0) scale(0.96) rotate(2deg);
      }

      68%, 100% {
        opacity: 0.94;
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }

    @keyframes guardRing {
      0%, 24% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }

      34% {
        opacity: 0.86;
      }

      82%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(var(--block-ring));
      }
    }

    @keyframes impactLine {
      0%, 22% {
        opacity: 0;
        transform: translate(-50%, -50%) scaleX(0);
      }

      32% {
        opacity: 1;
        transform: translate(-50%, -50%) scaleX(1);
      }

      56%, 100% {
        opacity: 0;
        transform: translate(-50%, -50%) scaleX(1.08);
      }
    }

    @keyframes blockStamp {
      0%, 34% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.72);
      }

      46% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.07);
      }

      62% {
        transform: translate(-50%, -50%) scale(1);
      }

      82% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.98);
      }
    }

    @keyframes blockFlash {
      0%, 24%, 100% {
        opacity: 0;
      }

      31% {
        opacity: 1;
      }

      44% {
        opacity: 0.16;
      }
    }

    @keyframes sparkDeflect {
      0%, 25% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--spark-rotate)) scaleY(0.24);
      }

      34% {
        opacity: 1;
      }

      92%, 100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--spark-x)),
            calc(-50% + var(--spark-y))
          )
          rotate(var(--spark-rotate))
          scaleY(1);
      }
    }

    @media (max-width: 920px) {
      .lab-shell {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
        max-height: none;
      }

      .block-panel {
        min-height: 360px;
      }

      .stage-header {
        flex-direction: column;
      }

      .metrics {
        justify-content: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .arena.is-blocking,
      .arena.is-blocking .shield-core,
      .arena.is-blocking .guard-ring,
      .arena.is-blocking .guard-ring::before,
      .arena.is-blocking .guard-ring::after,
      .arena.is-blocking .impact-line,
      .arena.is-blocking .block-stamp,
      .arena.is-blocking .block-flash,
      .arena.is-blocking .spark {
        animation-duration: 1ms;
      }
    }
  </style>
</head>

<body>
  <main class="lab-shell">
    <aside class="controls">
      <h1>Block Animation Lab</h1>
      <p>Laboratorio para testar uma animacao futura de bloqueio no modo ranqueado.</p>

      <section class="control-group" aria-label="Acoes rapidas">
        <button class="primary-button" type="button" id="playBlock">Tocar bloqueio</button>
        <div class="button-grid">
          <button type="button" data-preset="soft">Sutil</button>
          <button type="button" data-preset="default">Padrao</button>
          <button type="button" data-preset="heavy">Pesado</button>
          <button type="button" data-preset="fast">Rapido</button>
        </div>
      </section>

      <section class="control-group" aria-label="Configuracao da animacao">
        <div class="control-row">
          <label class="control-label" for="durationRange">
            Duracao
            <span class="control-value" id="durationValue">1320ms</span>
          </label>
          <input id="durationRange" type="range" min="760" max="2300" step="20" value="1320">
        </div>

        <div class="control-row">
          <label class="control-label" for="shakeRange">
            Tremor
            <span class="control-value" id="shakeValue">7px</span>
          </label>
          <input id="shakeRange" type="range" min="0" max="22" step="1" value="7">
        </div>

        <div class="control-row">
          <label class="control-label" for="ringRange">
            Expansao do escudo
            <span class="control-value" id="ringValue">3.40</span>
          </label>
          <input id="ringRange" type="range" min="1.8" max="5.2" step="0.05" value="3.4">
        </div>

        <div class="control-row">
          <label class="control-label" for="scaleRange">
            Impacto do escudo
            <span class="control-value" id="scaleValue">1.18</span>
          </label>
          <input id="scaleRange" type="range" min="1" max="1.42" step="0.01" value="1.18">
        </div>

        <div class="control-row">
          <label class="control-label" for="flashRange">
            Flash
            <span class="control-value" id="flashValue">0.48</span>
          </label>
          <input id="flashRange" type="range" min="0" max="1" step="0.01" value="0.48">
        </div>

        <label class="toggle-row" for="soundToggle">
          Tocar som de bloqueio
          <input id="soundToggle" type="checkbox">
        </label>
      </section>

      <section class="control-group" aria-label="Preset para copiar">
        <textarea class="config-output" id="configOutput" readonly></textarea>
      </section>
    </aside>

    <section class="stage-wrap">
      <header class="stage-header">
        <div>
          <h2>Teste visual de bloqueio</h2>
          <p>Simula uma extorsao sendo interrompida por uma influencia defensiva.</p>
        </div>
        <div class="metrics">
          <div class="metric">Acao<strong>Extorquir</strong></div>
          <div class="metric">Bloqueio<strong>Defesa</strong></div>
        </div>
      </header>

      <div class="stage">
        <section class="arena" id="arena" aria-label="Cenario de bloqueio">
          <div class="block-panel">
            <div class="impact-line" aria-hidden="true"></div>
            <div class="guard-ring" aria-hidden="true"></div>
            <div class="shield-core" aria-hidden="true">
              <img src="../assets/img/icons/shield-sword.svg" alt="">
            </div>
            <div class="block-stamp" aria-hidden="true">Bloqueado</div>
            <p class="block-copy">Gabriel Bloqueou!</p>
            <span class="spark" style="--spark-x: -196px; --spark-y: -96px; --spark-rotate: 62deg; --spark-delay: 0ms;"></span>
            <span class="spark" style="--spark-x: 188px; --spark-y: -108px; --spark-rotate: 118deg; --spark-delay: 18ms;"></span>
            <span class="spark" style="--spark-x: -154px; --spark-y: 112px; --spark-rotate: 134deg; --spark-delay: 36ms;"></span>
            <span class="spark" style="--spark-x: 208px; --spark-y: 86px; --spark-rotate: 48deg; --spark-delay: 8ms;"></span>
            <span class="spark" style="--spark-x: 22px; --spark-y: -174px; --spark-rotate: 7deg; --spark-delay: 42ms;"></span>
            <span class="spark" style="--spark-x: -30px; --spark-y: 172px; --spark-rotate: 172deg; --spark-delay: 22ms;"></span>
          </div>

          <div class="block-flash" aria-hidden="true"></div>
        </section>
      </div>
    </section>
  </main>

  <audio id="blockAudio" preload="auto" src="../assets/sounds/vfx/block-blades.mp3"></audio>

  <script>
    const state = {
      duration: 1320,
      shake: 7,
      ring: 3.4,
      scale: 1.18,
      flash: 0.48,
      sound: false
    };

    const presets = {
      soft: { duration: 1380, shake: 4, ring: 2.75, scale: 1.1, flash: 0.34 },
      default: { duration: 1320, shake: 7, ring: 3.4, scale: 1.18, flash: 0.48 },
      heavy: { duration: 1640, shake: 13, ring: 4.35, scale: 1.28, flash: 0.66 },
      fast: { duration: 920, shake: 6, ring: 3.05, scale: 1.14, flash: 0.42 }
    };

    const els = {
      arena: document.getElementById('arena'),
      playBlock: document.getElementById('playBlock'),
      audio: document.getElementById('blockAudio'),
      durationRange: document.getElementById('durationRange'),
      shakeRange: document.getElementById('shakeRange'),
      ringRange: document.getElementById('ringRange'),
      scaleRange: document.getElementById('scaleRange'),
      flashRange: document.getElementById('flashRange'),
      soundToggle: document.getElementById('soundToggle'),
      durationValue: document.getElementById('durationValue'),
      shakeValue: document.getElementById('shakeValue'),
      ringValue: document.getElementById('ringValue'),
      scaleValue: document.getElementById('scaleValue'),
      flashValue: document.getElementById('flashValue'),
      configOutput: document.getElementById('configOutput')
    };

    function syncControls() {
      document.documentElement.style.setProperty('--block-duration', `${state.duration}ms`);
      document.documentElement.style.setProperty('--block-shake', `${state.shake}px`);
      document.documentElement.style.setProperty('--block-ring', state.ring);
      document.documentElement.style.setProperty('--block-shield-scale', state.scale);
      document.documentElement.style.setProperty('--block-flash', state.flash);

      els.durationRange.value = state.duration;
      els.shakeRange.value = state.shake;
      els.ringRange.value = state.ring;
      els.scaleRange.value = state.scale;
      els.flashRange.value = state.flash;
      els.soundToggle.checked = state.sound;

      els.durationValue.textContent = `${state.duration}ms`;
      els.shakeValue.textContent = `${state.shake}px`;
      els.ringValue.textContent = state.ring.toFixed(2);
      els.scaleValue.textContent = state.scale.toFixed(2);
      els.flashValue.textContent = state.flash.toFixed(2);

      els.configOutput.value = `const BLOCK_ANIMATION = {
  duration: ${state.duration},
  shake: ${state.shake},
  ringScale: ${state.ring.toFixed(2)},
  shieldScale: ${state.scale.toFixed(2)},
  flash: ${state.flash.toFixed(2)},
  stampText: 'Bloqueado',
  icon: 'assets/img/icons/shield-sword.svg',
  sound: 'assets/sounds/vfx/block-blades.mp3'
};`;
    }

    function playSound() {
      if (!state.sound) return;

      els.audio.currentTime = 0;
      els.audio.volume = 0.52;
      els.audio.play().catch(() => {
        state.sound = false;
        syncControls();
      });
    }

    function playBlock() {
      els.arena.classList.remove('is-blocking');
      void els.arena.offsetWidth;
      playSound();
      els.arena.classList.add('is-blocking');
      window.clearTimeout(playBlock.clearTimer);
      playBlock.clearTimer = window.setTimeout(() => {
        els.arena.classList.remove('is-blocking');
      }, state.duration + 80);
    }

    function bindRange(input, key, parser = Number) {
      input.addEventListener('input', () => {
        state[key] = parser(input.value);
        syncControls();
      });
    }

    bindRange(els.durationRange, 'duration');
    bindRange(els.shakeRange, 'shake');
    bindRange(els.ringRange, 'ring');
    bindRange(els.scaleRange, 'scale');
    bindRange(els.flashRange, 'flash');

    els.soundToggle.addEventListener('change', () => {
      state.sound = els.soundToggle.checked;
      syncControls();
    });

    els.playBlock.addEventListener('click', playBlock);

    document.querySelectorAll('[data-preset]').forEach((button) => {
      button.addEventListener('click', () => {
        Object.assign(state, presets[button.dataset.preset] || presets.default);
        syncControls();
        playBlock();
      });
    });

    syncControls();
    window.setTimeout(playBlock, 260);
  </script>
</body>

</html>
