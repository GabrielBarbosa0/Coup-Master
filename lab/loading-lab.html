<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Lab - Coup Master</title>
  <style>
    :root {
      --bg: #14171e;
      --panel: #0f141c;
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #e6eef6;
      --muted: rgba(230, 238, 246, 0.72);
      --accent: #1e90ff;
      --gold: #ffcc00;
      --danger: #ff4048;
      --preview-bg: #14171e;
      --preview-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(30, 144, 255, 0.10), transparent 28%),
        radial-gradient(circle at 88% 14%, rgba(255, 204, 0, 0.08), transparent 26%),
        linear-gradient(135deg, #0f131a 0%, #171b23 48%, #0f1218 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .lab-shell {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    .controls {
      position: sticky;
      top: 18px;
      align-self: start;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 16px;
      border: 1px solid rgba(230, 238, 246, 0.12);
      border-radius: 8px;
      background: rgba(20, 24, 32, 0.94);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(8px);
    }

    .controls h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .controls p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .control-group {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .control-group label {
      color: rgba(230, 238, 246, 0.7);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .control-group input,
    .control-group select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid rgba(230, 238, 246, 0.16);
      border-radius: 7px;
      background: #10151d;
      color: var(--text);
    }

    .control-group input[type="range"] {
      min-height: auto;
      padding: 0;
      accent-color: var(--accent);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .button-row button {
      min-height: 40px;
      border: 1px solid rgba(230, 238, 246, 0.16);
      border-radius: 7px;
      background: #202734;
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .button-row button:hover {
      border-color: var(--accent);
    }

    .preview-wrap {
      min-height: calc(100vh - 36px);
      border: 1px solid rgba(230, 238, 246, 0.10);
      border-radius: 8px;
      overflow: hidden;
      background: #0d1118;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .preview-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0 14px;
      border-bottom: 1px solid rgba(230, 238, 246, 0.10);
      background: rgba(20, 24, 32, 0.82);
      color: rgba(230, 238, 246, 0.66);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .preview-stage {
      position: relative;
      display: grid;
      min-height: calc(100vh - 80px);
      place-items: center;
      background: var(--preview-bg);
      overflow: hidden;
    }

    .preview-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(30, 144, 255, 0.055), transparent 34%),
        radial-gradient(circle at 50% 68%, rgba(0, 0, 0, 0.16), transparent 38%);
      pointer-events: none;
    }

    .loading-preview {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: min(90vw, 520px);
      min-height: 172px;
      padding: 32px 36px;
      text-align: center;
      transform: scale(var(--preview-scale));
      transform-origin: center;
    }

    .loading-preview.is-panel {
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
    }

    .loading-preview.is-soft-panel {
      width: min(90vw, 360px);
      min-height: 150px;
      border-radius: 10px;
      background: rgba(15, 20, 28, 0.56);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.16);
    }

    .brand-title {
      display: none;
      margin: 0;
      color: var(--text);
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(42px, 8vw, 58px);
      font-weight: 400;
      line-height: 1.1;
    }

    .loading-preview.has-title .brand-title {
      display: block;
    }

    .loader-core {
      position: relative;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
    }

    .loader-core::before,
    .loader-core::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .loader-core::before {
      border: 3px solid rgba(230, 238, 246, 0.12);
    }

    .loader-core::after {
      border: 3px solid transparent;
      border-top-color: var(--accent);
      border-right-color: rgba(30, 144, 255, 0.68);
      animation: spin 0.92s linear infinite;
      filter: drop-shadow(0 0 8px rgba(30, 144, 255, 0.32));
    }

    .loader-core.is-ring {
      width: 70px;
      height: 70px;
    }

    .loader-core.is-ring::before {
      border-color: rgba(30, 144, 255, 0.24);
      animation: pulseRing 1.35s ease-in-out infinite;
    }

    .loader-core.is-ring::after {
      inset: 9px;
      border-top-color: var(--gold);
      border-right-color: rgba(255, 204, 0, 0.55);
      animation-duration: 1.08s;
    }

    .loader-core.is-dots {
      width: 90px;
      height: 28px;
      display: flex;
      gap: 10px;
    }

    .loader-core.is-dots::before,
    .loader-core.is-dots::after {
      display: none;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.45);
      animation: dotBounce 0.9s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.12s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.24s;
    }

    .loader-core.is-orbit {
      width: 72px;
      height: 72px;
    }

    .loader-core.is-orbit::before {
      border-style: dashed;
      border-color: rgba(230, 238, 246, 0.16);
      animation: spin 4s linear infinite reverse;
    }

    .loader-core.is-orbit::after {
      inset: 24px;
      border: 0;
      background: var(--gold);
      box-shadow: 0 -31px 0 -6px var(--accent), 22px 22px 0 -7px rgba(230, 238, 246, 0.75);
      animation: spin 1.15s linear infinite;
    }

    .loader-message {
      min-height: 20px;
      margin: 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .loading-preview.has-title .loader-message {
      margin-top: -2px;
    }

    .note {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid rgba(30, 144, 255, 0.18);
      border-radius: 8px;
      background: rgba(30, 144, 255, 0.07);
      color: rgba(230, 238, 246, 0.78);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseRing {
      0%,
      100% {
        transform: scale(0.92);
        opacity: 0.68;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes dotBounce {
      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      40% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    @media (max-width: 820px) {
      .lab-shell {
        grid-template-columns: 1fr;
      }

      .controls {
        position: relative;
        top: 0;
        max-height: none;
      }

      .preview-wrap,
      .preview-stage {
        min-height: 560px;
      }
    }

    @media (max-width: 480px) {
      .lab-shell {
        padding: 10px;
      }

      .loading-preview {
        width: min(90vw, 360px);
        min-height: 148px;
        padding: 26px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="lab-shell">
    <aside class="controls" aria-label="Controles do laboratório">
      <h1>Loading Lab</h1>
      <p>Teste variações de tela de carregamento sem depender do título com fonte pesada.</p>

      <div class="control-group">
        <label for="preset">Preset visual</label>
        <select id="preset">
          <option value="clean">Spinner limpo sem borda</option>
          <option value="soft">Card sutil sem contorno</option>
          <option value="ring">Anel pulsante</option>
          <option value="dots">Tres pontos</option>
          <option value="orbit">Orbita de moedas</option>
          <option value="classic">Modelo antigo com titulo</option>
        </select>
      </div>

      <div class="control-group">
        <label for="message">Texto abaixo</label>
        <input id="message" type="text" value="Carregando mesa...">
      </div>

      <div class="control-group">
        <label for="background">Fundo</label>
        <select id="background">
          <option value="#14171e">Padrao escuro</option>
          <option value="#10141c">Mais frio</option>
          <option value="#0d1118">Mais profundo</option>
          <option value="#171a16">Mesa escura</option>
        </select>
      </div>

      <div class="control-group">
        <label for="scale">Escala do preview</label>
        <input id="scale" type="range" min="80" max="120" value="100">
      </div>

      <div class="button-row">
        <button type="button" data-message="Carregando mesa...">Mesa</button>
        <button type="button" data-message="Entrando na sala...">Sala</button>
        <button type="button" data-message="Sincronizando partida...">Sync</button>
        <button type="button" data-message="Preparando ranqueado...">Ranked</button>
      </div>

      <div class="note">
        Minha aposta inicial: o spinner limpo sem borda resolve melhor a piscada da fonte e deixa o carregamento com cara mais rápida.
      </div>
    </aside>

    <section class="preview-wrap" aria-label="Preview da tela de carregamento">
      <div class="preview-topbar">
        <span>Preview</span>
        <span id="presetLabel">Spinner limpo sem borda</span>
      </div>

      <div id="previewStage" class="preview-stage">
        <div id="loadingPreview" class="loading-preview">
          <h2 class="brand-title">Coup Master</h2>
          <div id="loaderCore" class="loader-core" aria-hidden="true"></div>
          <p id="loaderMessage" class="loader-message">Carregando mesa...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const presets = {
      clean: {
        label: 'Spinner limpo sem borda',
        previewClass: '',
        coreClass: ''
      },
      soft: {
        label: 'Card sutil sem contorno',
        previewClass: 'is-soft-panel',
        coreClass: ''
      },
      ring: {
        label: 'Anel pulsante',
        previewClass: '',
        coreClass: 'is-ring'
      },
      dots: {
        label: 'Tres pontos',
        previewClass: '',
        coreClass: 'is-dots'
      },
      orbit: {
        label: 'Orbita de moedas',
        previewClass: '',
        coreClass: 'is-orbit'
      },
      classic: {
        label: 'Modelo antigo com titulo',
        previewClass: 'is-panel has-title',
        coreClass: ''
      }
    };

    const presetSelect = document.getElementById('preset');
    const messageInput = document.getElementById('message');
    const backgroundSelect = document.getElementById('background');
    const scaleInput = document.getElementById('scale');
    const previewStage = document.getElementById('previewStage');
    const loadingPreview = document.getElementById('loadingPreview');
    const loaderCore = document.getElementById('loaderCore');
    const loaderMessage = document.getElementById('loaderMessage');
    const presetLabel = document.getElementById('presetLabel');

    function renderDots() {
      loaderCore.replaceChildren();
      for (let index = 0; index < 3; index += 1) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        loaderCore.append(dot);
      }
    }

    function applyPreset() {
      const preset = presets[presetSelect.value] || presets.clean;
      loadingPreview.className = `loading-preview ${preset.previewClass}`.trim();
      loaderCore.className = `loader-core ${preset.coreClass}`.trim();
      presetLabel.textContent = preset.label;
      if (preset.coreClass === 'is-dots') renderDots();
      else loaderCore.replaceChildren();
    }

    function updateMessage() {
      loaderMessage.textContent = messageInput.value || 'Carregando...';
    }

    function updateBackground() {
      previewStage.style.setProperty('--preview-bg', backgroundSelect.value);
    }

    function updateScale() {
      previewStage.style.setProperty('--preview-scale', String(Number(scaleInput.value) / 100));
    }

    presetSelect.addEventListener('change', applyPreset);
    messageInput.addEventListener('input', updateMessage);
    backgroundSelect.addEventListener('change', updateBackground);
    scaleInput.addEventListener('input', updateScale);

    document.querySelectorAll('[data-message]').forEach((button) => {
      button.addEventListener('click', () => {
        messageInput.value = button.dataset.message;
        updateMessage();
      });
    });

    applyPreset();
    updateMessage();
    updateBackground();
    updateScale();
  </script>
</body>

</html>
